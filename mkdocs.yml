site_name: Liferay Docker Manager
site_url: https://peterrichards-lr.github.io/liferay-docker-manager/
site_description: >-
  Liferay Docker Manager (LDM): run, manage and develop Liferay DXP and Portal in Docker. Compose orchestration for local development.
site_author: Peter Richards
# LDM-#2215: without these Material shows no repository link in the header
# and no "edit this page" action, so a reader who spots a mistake has no
# route from the page to the file.
repo_url: https://github.com/peterrichards-lr/liferay-docker-manager
repo_name: peterrichards-lr/liferay-docker-manager
edit_uri: edit/master/docs/
theme:
  name: material
  # LDM-#2210: only `overrides/main.html` lives here, and it overrides exactly
  # one block. That is deliberate: a custom_dir shadows the theme's own
  # template, so a Material release that changes `main.html` does not reach
  # this site until the override is reconciled. One block plus `super()` keeps
  # that cost to the smallest surface that still works.
  custom_dir: overrides
  # LDM-#2215: the site's own mark, not Material's default icon and not
  # the official Liferay logo. The previous favicon WAS that logo, which
  # contradicted the "not an official Liferay product" disclaimer shown
  # on the same page. Liferay appears in text only -- see DESIGN-10350.
  #
  # logo.svg strokes #FFFFFF (it sits on the navy header); favicon.svg
  # strokes #0B5FFF (it sits on a light browser tab). They are NOT
  # interchangeable: each is invisible on the other's background.
  logo: assets/logo.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  # LDM-#1822: Liferay Blue. #0B5FFF is not one of Material's built-in palette
  # colours, so `primary:` cannot name it -- the scheme toggle is declared here
  # and the actual colours live in docs/assets/stylesheets/liferay-blue.css.
  # The source palette (lfr-tunnel) is dark-only; light is offered too rather
  # than forcing one mode on every reader.
  font:
    text: Inter
    code: Roboto Mono
  # LDM-#1820: navigation.indexes and navigation.sections are enabled here
  # because LDM-#1815 and LDM-#1816 depend on them; they are inert until those
  # land (a section without an index.md behaves exactly as before).
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.indexes
    # LDM-#2215: navigation.footer gives prev/next links; content.action.edit
    # is what renders the pencil that `edit_uri` above points at.
    - navigation.footer
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  # LDM-#2215: `primary`/`accent: custom` is load-bearing, not decoration.
  # Without it Material emits its own palette values and the tokens in
  # liferay-blue.css are overridden rather than applied.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# LDM-#2215: the About link now lives in overrides/partials/copyright.html,
# where Jinja's `url` filter can resolve it against the current page. It used
# to be hardcoded here as an absolute URL, because `copyright` is rendered as
# raw HTML and is NOT Jinja-processed -- so it could not interpolate site_url,
# and a root-relative "/about/" 404s on a PROJECT site served under a subpath.
#
# Material renders this string in the footer of every page, so what remains is
# the disclaimer itself.
copyright: >-
  A community project &mdash; not an official Liferay product

# LDM-#2210: search-engine ownership verification. Consumed by
# overrides/main.html, which emits the meta tag only when the key is set.
#
# `bing_site_verification` can be added here the same way -- the template
# already emits `msvalidate.01` under the same guard, so it needs no change.
#
# Removing this key keeps `mkdocs build` GREEN and silently unverifies the
# property, which is why scripts/check_site_verification.py reads the BUILT
# HTML rather than this file.
extra:
  google_site_verification: r7MfW8Y9zUhxsygop-Ubkr6dt7i9rUmddL4pEI26Ngk
  # LDM-#2215: consumed by overrides/main.html. `social_image` is joined to
  # `site_url` there, so it must NOT lead with a slash and `site_url` must keep
  # its trailing one -- test_about_page_claims.py asserts both, because the
  # failure mode is a card that renders blank rather than a build that breaks.
  social_image: assets/social-preview.png
  favicon_svg: assets/favicon.svg
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/peterrichards-lr
      name: More Liferay tools by Peter Richards

extra_css:
  - assets/stylesheets/liferay-blue.css

plugins:
  - search

# LDM-#1820: the docs use GitHub's alert syntax (`> [!NOTE]`), which MkDocs does
# not understand -- it emitted a plain blockquote with the marker still visible,
# in 57 places. Converting the sources to `!!! note` would fix the site and
# break GitHub, where these files are also read, so the conversion happens at
# build time instead. A core `hooks:` entry rather than a third-party plugin, so
# nothing new is taken on -- see the toolchain note in LDM-#1814.
hooks:
  - mkdocs_hooks/github_alerts.py

markdown_extensions:
  # Targets of the hook above.
  - admonition
  - pymdownx.details
  # Required by the card grids LDM-#1815 will add.
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  # Without a mermaid custom fence the 3 architecture diagrams rendered as
  # syntax-highlighted code blocks, which is worse than no diagram.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  # check_paths turns a snippet pointing at a missing file into a build
  # failure rather than a silently empty block. No page uses snippets today,
  # so this costs nothing now and is a guard the first one gets for free.
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

nav:
  - Home: README.md
  - Tutorials:
    - tutorials/index.md
    - First 5 Minutes: tutorials/first_5_minutes.md
    - PaaS Local Dev: tutorials/paas_local_dev.md
    - Liferay Workspace Local Dev: tutorials/workspace_development.md
  - How-To:
    - how-to/index.md
    # LDM-#1816: grouped to match how-to/index.md, so the sidebar and the
    # landing page tell the same story. Nav-only -- no page URL changes.
    - Install:
      # LDM-#1838: this is the installation guide -- 610 lines of prerequisites,
      # per-OS SSL tooling, permissions and troubleshooting. It was labelled
      # "Quick Start" and filed under Tutorials, where it contested the front
      # door and made the docs look far larger than they are. The file keeps its
      # path so no published URL breaks; only its label and place change.
      - Installation & Setup: tutorials/quick_start.md
      - macOS: how-to/install_macos.md
      - Windows: how-to/install_windows.md
      - Linux: how-to/install_linux.md
    - Get a project running:
      - Fresh Vanilla Start: how-to/vanilla_start.md
      - Workspace Import: how-to/workspace_import.md
      - Nightly & Master Builds: how-to/nightly_master_builds.md
      - Version Upgrades: how-to/version_upgrades.md
    - Develop:
      - Client Extensions: how-to/client_extensions.md
      - Portal Patches: how-to/portal_patches.md
      - Runtime Overrides: how-to/runtime_overrides.md
      - Development & Building: how-to/development.md
    - Data & environments:
      - Data Management: how-to/data_management.md
      - Custom Containers: how-to/custom_containers.md
      - Multi-Compose Architecture: how-to/multi_compose.md
    - Share & connect:
      - Sharing & Tunnels: how-to/sharing_tunnels.md
      - AI & MCP: how-to/ai_mcp_guide.md
    - Operate at scale:
      - Multi-Node Orchestration: how-to/multi_node_orchestration.md
      - Cloud Deployment: how-to/cloud_deployment.md
      - Target Node IAM Least Privilege: how-to/target_node_iam_least_privilege.md
      - End-to-End Testing: how-to/e2e_testing.md
  - Reference:
    - reference/index.md
    - Configuration: reference/configuration.md
    - CLI Reference:
      - Core: reference/cli/core.md
      - Data: reference/cli/data.md
      - System: reference/cli/system.md
      - Cloud: reference/cli/cloud.md
    - Compatibility: reference/compatibility.md
    - Security: reference/security.md
    - Third-Party Tools: reference/third_party_tools.md
    - Networking: reference/networking.md
    - Advanced CLI: reference/advanced_cli.md
    - JVM & Database Tuning: reference/tuning.md
    - Logging Strategy: reference/logging-strategy.md
  - About these docs: about.md
  - Explanation:
    - explanation/index.md
    - Architecture: explanation/architecture.md
    - Remote Node Architecture: explanation/remote-node-architecture.md
    - Permissions & the Reclaim Helper: explanation/permissions-and-reclaim.md
    - Properties: explanation/properties.md
    - Key Features: explanation/conventions.md
    - Conventions & Configuration: explanation/conventions_and_config.md
    - Internationalization & Transcoding: explanation/i18n.md
    - FAQ: explanation/faq.md
  # LDM-#1817: Troubleshooting and Showcase are user-facing and were filed in
  # a drawer named after project governance, where users do not look.
  # Troubleshooting sits next to How-To because it is reached at a reader's
  # least patient moment.
  - Troubleshooting: TROUBLESHOOTING.md
  - Showcase:
    - Intro: showcase/README.md
    - OSGi State Persistence: showcase/OSGI_STATE_PERSISTENCE.md
  # Renamed from "Project Info": these address maintainers and contributors,
  # and the old name did not say so, which told readers that some unknown
  # fraction of the section was irrelevant to them.
  - Project & Contributing:
    # LDM-#2215 asked for a deliberate decision on PLAYBOOK.md, which AICA
    # excludes from its own site with `exclude_docs`. KEPT HERE, for two
    # reasons that are specific to this repo rather than a preference:
    #
    #   * this section is already named for its audience. LDM-#1817 renamed it
    #     from "Project Info" precisely so a reader knows these pages address
    #     maintainers and contributors, which is the problem `exclude_docs`
    #     solves elsewhere.
    #   * docs/README.md routes "...contribute to LDM itself" straight at it.
    #     Excluding the file without rewriting that row turns the row into a
    #     broken link -- and `mkdocs build --strict` now FAILS on one, so the
    #     cost would be a red build rather than a quiet 404.
    - Playbook: PLAYBOOK.md
    - Roadmap: ROADMAP.md
    - Testing: TESTING.md
    - Roadmap Plans:
      - Clustered HA: roadmap/plans/clustered_ha_profile.md
      - External DB: roadmap/plans/external_database_integration.md
      - Keycloak SSO: roadmap/plans/keycloak_sso_profile.md
      - Profile Loader: roadmap/plans/profile_loader_logic.md
