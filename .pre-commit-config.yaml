repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/semgrep/semgrep
    rev: v1.168.0
    hooks:
      - id: semgrep
        args: ['--config', '.semgrep.yaml', '--error']

  # LDM-#1407: this rev MUST track `mypy==` in requirements-dev.txt, which is
  # what CI installs and gates on. It was pinned at v1.10.0 while CI ran 2.3.1,
  # and they disagreed on real code -- the older mypy reported three errors on
  # master that the newer one does not, so a developer fixing "failures" locally
  # was chasing findings CI would never raise, while CI-only failures stayed
  # invisible until push.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        stages: [pre-push, manual]
        additional_dependencies:
          - types-requests
          - types-PyYAML
        # LDM-#1407: run exactly what CI runs -- `mypy ldm_core
        # --config-file=mypy.ini` (.github/workflows/ci.yml). By default the
        # hook passes the changed filenames, which widened the scope to
        # `scripts/` and reported a union-attr finding in scripts/release.py
        # that CI does not gate on. Local being *stricter* than CI is the same
        # defect as local being laxer: either way the two disagree, and the
        # developer cannot tell which findings actually matter.
        pass_filenames: false
        args: [ldm_core, --config-file=mypy.ini]

  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck (system binary, pinned 0.11.0)
        # LDM-#1325: a local hook, routed through a wrapper that asserts the
        # version, and named for what actually runs.
        #
        # This was the upstream koalaman/shellcheck-precommit repo at
        # `rev: v0.10.0`, overridden with `language: system` + `entry:
        # shellcheck`. Two problems followed. The rev never controlled the
        # binary -- it only supplied the display name, so the hook reported
        # "ShellCheck v0.10.0" while running whatever was on PATH. And nothing
        # checked which version that was, so local and CI silently disagreed:
        # an SC2002 finding passed the local gate on 0.11.0 (which demoted that
        # check) and failed all four CI legs on 0.10.
        #
        # `language: system` is retained on purpose. The upstream hook is
        # `language: docker_image`, a Docker pull per commit that was removed
        # in 19227f6c for CI resilience; and a pinned shellcheck-py would drop
        # a 61MB executable into a Python env's bin/, which is the shape
        # endpoint protection has quarantined on developer machines here
        # (LDM-#1240). The wrapper installs nothing.
        #
        # The pinned version is asserted in scripts/run_shellcheck.sh and
        # installed in .github/workflows/ci.yml. Change them together.
        language: system
        entry: scripts/run_shellcheck.sh
        files: \.sh$

  - repo: local
    hooks:
      - id: pytest
        stages: [pre-push, manual]
        name: pytest
        entry: scripts/run_python.sh -m pytest
        language: system
        pass_filenames: false
        always_run: true

      - id: bandit
        stages: [pre-push, manual]
        name: bandit
        entry: scripts/run_python.sh -m bandit
        args: [ "-r", "ldm_core/", "-x", "ldm_core/tests/", "--severity-level", "medium" ]
        language: system
        pass_filenames: false
        always_run: true

      - id: check-version-sync
        name: Check Version Synchronization
        entry: scripts/run_python.sh scripts/check_version_sync.py
        language: system
        files: ^pyproject\.toml$|^ldm_core/constants\.py$
        pass_filenames: false

      - id: check-cli-drift
        name: Check CLI Documentation Drift
        entry: scripts/run_python.sh scripts/check_cli_drift.py
        language: system
        files: ^ldm_core/cli\.py$|^docs/reference/cli/core\.md$|^docs/reference/advanced_cli\.md$
        pass_filenames: false
        always_run: true

      - id: sync-docs
        name: Sync Documentation
        entry: bash -c 'scripts/run_python.sh scripts/sync_docs.py && git diff --exit-code docs/*.md'
        language: system
        files: ^ldm_core/|^scripts/sync_docs\.py$|^docs/
        pass_filenames: false
        always_run: true

      - id: bump-docs-timestamps
        name: Bump Documentation Timestamps
        entry: scripts/run_python.sh scripts/append_timestamps.py
        language: system
        files: \.md$
        pass_filenames: true

      - id: check-docs-review
        name: Check Documentation Review Status
        entry: scripts/run_python.sh scripts/check_docs_review.py --max-review-days 180 --max-gap-days 180
        language: system
        files: \.md$
        pass_filenames: false
        always_run: true

      - id: check-markdown-links
        name: Check Markdown Links
        entry: scripts/run_python.sh scripts/check_markdown_links.py
        language: system
        files: \.md$
        pass_filenames: false
        always_run: true

      - id: check-powershell-ascii
        name: Check PowerShell ASCII Encoding
        entry: scripts/run_python.sh scripts/check_powershell_ascii.py
        language: system
        files: \.ps1$|\.psm1$
        pass_filenames: false
        always_run: true

      - id: psscriptanalyzer
        name: PSScriptAnalyzer
        entry: scripts/run_psscriptanalyzer.sh
        language: system
        files: \.ps1$|\.psm1$
        pass_filenames: false

      - id: validate-compose
        name: Validate Docker Compose Templates
        entry: scripts/run_python.sh scripts/validate_compose.py
        language: system
        files: ^ldm_core/resources/infra-compose\.yml$|^scripts/validate_compose\.py$
        pass_filenames: false


  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.24
    hooks:
      - id: actionlint

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.16.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: deptry
        stages: [pre-push, manual]
        name: deptry
        entry: scripts/run_python.sh -m deptry .
        language: system
        pass_filenames: false
        always_run: true
