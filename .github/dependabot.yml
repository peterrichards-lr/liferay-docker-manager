version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    # LDM: explicit `labels:` replaces GitHub's automatic per-ecosystem
    # labeling rather than adding to it, so the defaults ("dependencies",
    # "github_actions") must be re-listed alongside the new one --
    # otherwise-untouchable Dependabot PRs were failing the mandatory
    # issue-link-check on every single update.
    labels:
      - "dependencies"
      - "github_actions"
      - "no-issue-needed"

  # Maintain Python pip dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "no-issue-needed"
    # LDM-#2229, from the template's own dependabot.yml at v2.5.0: mkdocs 2.0
    # removes the plugin system and rewrites theming, and Material for MkDocs
    # warns that every plugin and theme override breaks with no migration
    # path. This docs site depends on both -- mkdocs_hooks/github_alerts.py
    # through `hooks:`, and overrides/main.html through `custom_dir` -- so a
    # 2.x bump can only break it. The same reasoning is already recorded in
    # mkdocs.yml, which chose a core hook over a plugin for it (LDM-#1814).
    # Patch and minor 1.x releases still come through. Revisit when Material
    # supports mkdocs 2.
    ignore:
      - dependency-name: "mkdocs"
        versions: [">= 2"]
