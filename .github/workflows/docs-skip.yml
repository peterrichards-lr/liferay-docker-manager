# LDM-#2215: the companion to the paths filter in docs.yml.
#
# A required check that never RUNS is not a passing check -- GitHub leaves it
# pending forever and the pull request cannot merge. docs.yml only runs when a
# documentation path changes, so every other PR would hang on it.
#
# This reports the SAME job name on the inverse path set, so the check is
# always present and always truthful: either the docs really were built, or
# there were no docs to build.
#
# The two path lists must stay complements of each other. Adding a path to
# docs.yml without removing it here would make both workflows claim the same
# check on the same PR, and GitHub would take whichever finished last.
name: Deploy Documentation

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "overrides/**"
      - "requirements-dev.txt"
      - "mkdocs_hooks/**"
      - "scripts/check_docs_rendered.py"
      - "scripts/check_template_drift.py"
      - "scripts/check_docs_review.py"
      - "scripts/ldm_docs_common.py"
      - ".agents/TEMPLATE_REF.md"
      - ".github/workflows/docs.yml"

# The only job here echoes one line. It checks nothing out, calls no API and
# publishes nothing, so it needs no token scopes at all -- an empty map is the
# tightest setting that still runs, and it is deliberate rather than an
# oversight. Do not widen this to `contents: read` to match the siblings:
# docs.yml needs that because it builds and deploys, and this one does not.
#
# Without any `permissions:` block the workflow inherits the repository
# default, which is what CodeQL's actions/missing-workflow-permissions alert
# was reporting.
permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: No documentation changes in this pull request
        run: echo "No documentation paths changed -- nothing to build."
