name: Target Node Cost & Power Control

permissions:
  contents: read

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'status'
        type: choice
        options:
          - status
          - wake
          - sleep
          - enforce
      # LDM-#2292: free text, not a choice list. A choice list publishes the
      # node names in this file; they now live only in NODE_POWER_CONFIG.
      # Note that a value typed here is visible on the run page.
      node:
        description: 'Target node name (wake/sleep; defaults to secrets.LDM_NODE_TARGET)'
        required: false
        type: string
      ttl:
        description: 'Wake TTL Duration (e.g. 2h, 4h, 30m)'
        required: false
        default: '2h'

jobs:
  power-management:
    name: Target Node Power Manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      # LDM-#2292: the config is a secret, written for this run only, with
      # every node name, instance id, host and region masked in the log.
      - name: Write node-power config
        env:
          NODE_POWER_CONFIG: ${{ secrets.NODE_POWER_CONFIG }}
        run: python3 scripts/write_node_power_config.py

      - name: Execute Node Power Command
        run: |
          TARGET_NODE="${{ secrets.LDM_NODE_TARGET }}"
          TARGET_NODE="${TARGET_NODE:-${{ secrets.AWS_TARGET_NODE }}}"
          TARGET_NODE="${TARGET_NODE:-${{ inputs.node }}}"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 scripts/manage_target_nodes.py enforce
          else
            case "${{ inputs.action }}" in
              status)
                python3 scripts/manage_target_nodes.py status
                ;;
              wake|sleep)
                if [ -z "$TARGET_NODE" ]; then
                  echo "::error::No target node: set the 'node' input or the LDM_NODE_TARGET secret."
                  exit 1
                fi
                if [ "${{ inputs.action }}" = "wake" ]; then
                  python3 scripts/manage_target_nodes.py wake "$TARGET_NODE" --ttl "${{ inputs.ttl }}"
                else
                  python3 scripts/manage_target_nodes.py sleep "$TARGET_NODE"
                fi
                ;;
              enforce)
                python3 scripts/manage_target_nodes.py enforce
                ;;
            esac
          fi
