# LDM-#1662: the best-effort half of platform verification.
#
# Split out of `LDM Platform Verification (Multi-OS)`, which is now Linux-only.
# The arms here cannot currently pass on GitHub-hosted runners, and the reason is
# a property of the runner rather than of LDM:
#
#   * macOS -- Colima does not start on `macos-26-arm64`, so the suite finds no
#     Docker daemon at unix:///var/run/docker.sock.
#
# They were never passing. Until LDM-#1611 (PR #1622) they swallowed the verify
# script's exit status and reported `success` while uploading a `-fail.txt`
# report; #1622 made that honest, and this split stops the resulting permanent
# red from drowning the Linux signal that does work.
#
# WHY A SEPARATE WORKFLOW rather than `continue-on-error: true` on the job:
# that flag makes the job report `success`, which is precisely the LDM-#1611
# defect -- a green job that verified nothing and so manufactured the appearance
# of coverage. "Best effort" must mean *red in a workflow allowed to be red*,
# never *green over there*. The per-report assertion below is kept for the same
# reason, and `ldm_core/tests/test_ci_verification_reporting.py` guards it here
# exactly as it does in the Linux workflow.
#
# This workflow publishes NOTHING. macOS and Windows rows in the compatibility
# matrix are curated by hand from the maintainer's own runs; `sync-compatibility`
# in the Linux workflow filters on the `linux-workstation-` prefix and has never
# published an arm from here. Its output is diagnostic only.
name: LDM Platform Verification (Best Effort)

on:
  workflow_dispatch: # Allow manual trigger
  schedule:
    - cron: '0 2 * * *' # Run nightly at 2 AM UTC, alongside the Linux workflow
  push:
    tags: ["v*"] # Run on every release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-macos:
    name: Verify macOS (Colima)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # LDM-#1659: see the equivalent step in verify-linux.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Colima and Docker
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install colima docker docker-compose || true

      # The continue-on-error here is NOT the LDM-#1611 defect and is kept
      # deliberately: if Colima cannot start, the probe below decides what that
      # means, rather than aborting the job with only a brew/colima trace.
      #
      # LDM-#1720: `--vm-type=vfkit` was tried first and has never worked --
      # this Colima rejects it outright with `invalid vmType: 'vfkit'`, so the
      # only thing it produced was a `fatal` line making the log look worse
      # than it was. `vz` is the real first choice on Apple Silicon; `qemu` is
      # a genuine fallback rather than a synonym for the default.
      - name: Start Colima
        continue-on-error: true
        run: |
          colima start --cpu 2 --memory 4 --vm-type=vz \
            || colima start --cpu 2 --memory 4 --vm-type=qemu

      # LDM-#1611: `continue-on-error: true` was here, and it is the whole bug
      # on this platform. The bash script propagates its own failure correctly
      # (`set -e` plus explicit `exit 1`), so nothing else was swallowing it --
      # the step simply declared the failure unimportant. Runs 33752742268
      # (v2.21.0-pre.2) and 34063433007 (v2.21.0) reported `success` while
      # uploading a `-fail.txt` report containing a header, "Docker: running"
      # and "--- FAILURE DEBUG LOGS ---": no verification step ever ran.
      #
      # The macOS runner's Docker being unusable is a runner defect, not an
      # LDM defect, and fixing that is out of scope here. But a job that
      # cannot report failure is worse than an absent one, because it
      # manufactures the evidence the compatibility matrix is built from.
      # A red job says "unverified"; a green one said "verified" and was wrong.
      # LDM-#1720: the third state.
      #
      # Before this there were two outcomes -- passed and failed -- and
      # "Docker never started, so nothing was attempted" was being forced into
      # "failed". That is not a failure, it is an absence, and reporting it as
      # red on every single release tag taught everyone to ignore the one job
      # that is supposed to tell them something is wrong.
      #
      # The hosted macOS image cannot reliably boot Colima's `vz` driver: the
      # VM gets as far as `Converting datadisk to a raw disk` and then exits
      # with `Running:false`. That is a runner limitation, not an LDM defect.
      #
      # This probe decides which of the three outcomes applies. It does NOT
      # weaken LDM-#1611 -- if Docker is up, the suite runs and its failure is
      # still red. What changed is that a run which never started is no longer
      # described as one that failed.
      - name: Probe the Docker daemon
        id: docker_probe
        shell: bash
        run: |
          if docker info >/dev/null 2>&1; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
            echo "Docker is usable; the suite will run and its result will be reported."
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Colima did not start, so Docker is unavailable on this runner. Nothing will be verified on macOS for this tag."
          fi

      - name: Run E2E Verification Suite (macOS)
        if: steps.docker_probe.outputs.usable == 'true'
        env:
          GITHUB_ACTIONS: "true"
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install .
          bash scripts/verify_e2e_refactor.sh --ci

      # Deliberately NOT named `verify-*.txt`.
      #
      # The compatibility-sync tool decides a report's status by scanning its
      # CONTENT for failure markers and defaulting to pass
      # (`status_slug = "pass" if passed else "fail"`) -- it does not key on the
      # filename. A tidy `verify-...-skip.txt` with no failure markers in it
      # would therefore be ingested as a PASS, recording
      # "verified on macOS" for a run that never started Docker. That is the
      # precise harm LDM-#1611 exists to prevent, reintroduced through the back
      # door.
      #
      # A name outside the `verify-*` glob cannot be picked up by that tool at
      # all, which is a structural guarantee rather than a careful one.
      - name: Record that nothing was verified
        if: steps.docker_probe.outputs.usable != 'true'
        shell: bash
        run: |
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          cat > "macos-SKIPPED-${stamp}.txt" <<'EOF'
          LDM macOS verification: SKIPPED -- nothing was verified.

          Colima could not start on this GitHub-hosted macOS runner, so there was
          no Docker daemon and the suite was not run. This is a runner
          limitation (the `vz` driver fails during VM boot), not a result about
          LDM.

          This is deliberately NOT reported as a failure: no verification was
          attempted, so there is nothing to have failed. It is equally
          deliberately NOT reported as a pass -- the compatibility matrix keys
          on `-pass` reports and must never record this as verified.

          macOS coverage for this tag comes from the manually verified runs
          recorded in the compatibility matrix (LDM-#1662, LDM-#1720).
          EOF

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-results-macos
          path: |
            verify-*.txt
            macos-SKIPPED-*.txt
          retention-days: 7

      # LDM-#1611: see the equivalent step in verify-linux.
      #
      # LDM-#1720: gated on the probe. When Docker never came up the suite did
      # not run, so there is no report to assert on -- and demanding one would
      # fail the job for an absence, which is the whole defect being fixed.
      # When Docker IS up this is unchanged: a `-fail.txt` or a missing
      # "ALL E2E VERIFICATIONS PASSED" marker still fails the job.
      - name: Assert the verification report says it passed
        if: always() && steps.docker_probe.outputs.usable == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          reports=(verify-*.txt)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::No verification report was produced by scripts/verify_e2e_refactor.sh."
            exit 1
          fi
          rc=0
          for report in "${reports[@]}"; do
            if [[ "$report" == *-fail.txt ]]; then
              echo "::error::${report} is a FAILURE report; this job did not verify anything."
              rc=1
            elif ! grep -q "ALL E2E VERIFICATIONS PASSED" "$report"; then
              echo "::error::${report} has no 'ALL E2E VERIFICATIONS PASSED' marker; the suite did not run to completion."
              rc=1
            else
              echo "OK: ${report}"
            fi
          done
          exit "$rc"

