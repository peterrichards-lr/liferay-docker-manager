# LDM-#1768: verify the PUBLISHED release, not the build that produced it.
#
# CI proves the commit builds. Four defects during the v2.22.0 cycle were
# invisible to it by construction and found only by a human downloading the
# artifact: a release with no installer, a bundle with no common/, a MANIFEST
# claiming an activation key it could not carry, and an installer absent from
# checksums.txt. Each is trivial to catch once you hold the published bytes.
#
# LDM-#1774: the `release` trigger below CANNOT fire for a release published by
# CI. GitHub does not start a workflow run from an event triggered by
# GITHUB_TOKEN, and `ci.yml` publishes with exactly that token -- so this
# workflow recorded zero runs while reading as though every release was being
# checked. The real gate is now a step at the end of `ci.yml`'s release job.
#
# The trigger is kept because it still fires for a release published by a human
# or a PAT, but it must never again be mistaken for the automatic path.
#
# `workflow_dispatch` is the genuinely useful half: it verifies any historical
# tag on demand, which is how the v2.22.0-pre.7 and -pre.5 evidence was gathered.
name: Verify Published Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (e.g. v2.23.0-pre.2)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          # `release.published` carries the tag; a manual run supplies it.
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          echo "Verifying published release: $TAG"
          python3 scripts/verify_published_release.py --tag "$TAG"
