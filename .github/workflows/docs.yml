name: Deploy Documentation

on:
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      # LDM-#2210: the theme override that injects the search-console meta
      # tag. Without this line a template-only change never rebuilds, so the
      # live site keeps serving the previous HTML and the edit looks applied
      # while nothing has moved.
      - "overrides/**"
      - "requirements-dev.txt"
      - "mkdocs_hooks/**"
      - "scripts/check_social_card.py"
      - "scripts/check_docs_rendered.py"
      - "scripts/check_template_drift.py"
      - "scripts/check_docs_review.py"
      - "scripts/ldm_docs_common.py"
      - ".agents/TEMPLATE_REF.md"
      - ".github/workflows/docs.yml"
  # LDM-#2215: build on PRs too. Before this the docs built only AFTER a merge,
  # so a broken link or a bad template reached `master` and was discovered by
  # the deploy failing -- on the trunk, with nothing to revert but the merge.
  # The same paths filter applies, and docs-skip.yml reports the same job name
  # for PRs that touch none of them, so the check can be made required without
  # leaving unrelated PRs pending forever.
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "overrides/**"
      - "requirements-dev.txt"
      - "mkdocs_hooks/**"
      - "scripts/check_social_card.py"
      - "scripts/check_docs_rendered.py"
      - "scripts/check_template_drift.py"
      - "scripts/check_docs_review.py"
      - "scripts/ldm_docs_common.py"
      - ".agents/TEMPLATE_REF.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch: # Allow manual trigger

# LDM-#1053: only one Pages DEPLOYMENT should ever be in flight -- a
# half-applied deploy leaves the live site broken, so a master run is never
# cancelled. LDM-#2215: PR builds publish nothing, so they take a per-ref group
# instead; without this every PR would queue behind every other one on the
# single "pages" group, and a force-push would leave its predecessor running.
concurrency:
  group: ${{ github.event_name == 'push' && 'pages' || format('docs-pr-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Build site
        # LDM-#2215: --strict turns a WARNING into a failed build. MkDocs warns
        # about broken internal links and missing nav targets and then emits
        # the page anyway, so without this the site publishes its own 404s.
        run: mkdocs build --strict --site-dir _site

      # LDM-#2210: BEFORE the upload, so a site missing its verification tag
      # is never published. Removing extra.google_site_verification keeps the
      # build green and silently unverifies the property in Search Console --
      # there is no other signal, which is why this reads the built HTML
      # rather than the config that produced it.
      #
      # Exit 3 means no HTML was found at all. That is a FAILURE here, not a
      # skip: an empty site directory means the build did not happen, which is
      # not the same as a site that verified.
      # PRESENCE, not the token's value. The token lives in mkdocs.yml and is
      # emitted verbatim; repeating it here would mean two copies to keep in
      # step, and a rotated token would fail CI against the stale one. What
      # this catches is the failure that is actually silent -- the key gone,
      # the tag gone, the build still green. That the token is the RIGHT one
      # is verified once, by Search Console accepting it.
      # LDM-#2229: one check replaces three. check_docs_rendered.py is governed
      # by ai-agent-template and asserts MISSING-VERIFICATION (the search
      # console tag, Google AND Bing), NO-NOTICE, HOME-LAYOUT and STYLE-TITLE
      # -- which were scripts/check_site_verification.py,
      # check_community_notice.py and check_home_layout.py here -- plus
      # LEAKED-ALERT, UNRENDERED-DIAGRAM, UNDATED-PAGE, ABOUT-LINK and NAV,
      # which nothing here checked at all.
      #
      # Per-site values come from extra.docs_standard in mkdocs.yml. Never
      # edit the script to change what it asserts for this site.
      - name: Verify the built site gives readers what the source asks for
        run: python3 scripts/check_docs_rendered.py _site --config mkdocs.yml

      # LDM-#2215: also BEFORE the upload. `og:image` is an absolute URL built
      # from site_url + extra.social_image and is resolved by a SCRAPER days
      # later, so a typo in either leaves the build green and the card blank.
      # Measured: mistyping social_image by one character still passes
      # `mkdocs build --strict`.
      - name: Verify the social card and icons resolve
        run: |
          python3 scripts/check_social_card.py _site \
            --site-url=https://peterrichards-lr.github.io/liferay-docker-manager/

      # LDM-#2229: the shared docs files must still BE the shared docs files.
      # --docs-site scopes the comparison to the files the docs standard
      # governs, plus the stylesheet through its path mapping, so this job
      # fails on them and only them. A transport failure warns; a 404 fails,
      # because a missing path or a permissions problem will not fix itself.
      #
      # Before the upload, like every check above: a drifted shared file that
      # is discovered after deployment has already reached readers.
      #
      # THE COMPARISON BASIS DIFFERS BY EVENT, deliberately (template-sync
      # SKILL.md: "use it where a template merge must not block, such as a
      # deploy").
      #
      # By default the check compares against upstream HEAD, so a merge in the
      # template reddens this job with nothing changed here. That happened
      # within hours of adopting v2.2.0: ai-agent-template#144, #145 and #149
      # landed on main, and every LDM docs PR went red on files copied
      # byte-for-byte from the tag.
      #
      #   push (the path that deploys) -> --against-recorded, which compares
      #     against the commit in .agents/TEMPLATE_REF.md. An upstream merge
      #     can then never block a deploy of docs that are correct for the
      #     version this repo has actually adopted.
      #   pull_request -> upstream HEAD, deliberately left as-is. That is the
      #     signal that a sync PR is due, and a PR is where acting on it is
      #     cheap. It must stay a signal and not a blocker: a red PR here is
      #     read, a red deploy is a broken site.
      # LDM-#2229: the shared docs files must still BE the shared docs files.
      # --docs-site scopes the comparison to the files the docs standard
      # governs, plus the stylesheet through its path mapping, so this job
      # fails on them and only them. A transport failure warns; a 404 fails,
      # because a missing path or a permissions problem will not fix itself.
      #
      # Before the upload, like every check above: a drifted shared file that
      # is discovered after deployment has already reached readers.
      #
      # STAMP-BASED, taken verbatim from the template's own docs.yml at
      # v2.4.0 (ai-agent-template#157). It compares against the commit
      # recorded in .agents/TEMPLATE_REF.md whenever the stamp holds a real
      # one, and falls back to upstream HEAD only for an unstamped repo.
      #
      # This replaces an event-conditional version written here first, which
      # used --against-recorded on push and HEAD on pull requests. The
      # upstream form is better for a reason worth recording: comparing a PR
      # against HEAD makes every docs PR go red whenever the template merges
      # anything, on files copied byte-for-byte from a tag. That happened
      # five times in one morning during this migration and cost two
      # abandoned sync branches. The signal it provided -- "a sync is due" --
      # is better served by the template's own release notice than by a red
      # check on an unrelated PR.
      - name: Verify the shared docs files match the template
        run: |
          if [ ! -f .agents/TEMPLATE_REF.md ]; then
            echo "No .agents/TEMPLATE_REF.md: nothing to compare."
            exit 0
          fi
          recorded=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); from pathlib import Path; from check_template_drift import UNKNOWN_STAMP_VALUE, parse_template_reference; commit = parse_template_reference(Path(".agents/TEMPLATE_REF.md").read_text(encoding="utf-8")).commit; print("" if commit == UNKNOWN_STAMP_VALUE else commit)')
          if [ -n "$recorded" ]; then
            echo "Comparing against the recorded commit $recorded."
            python3 scripts/check_template_drift.py --docs-site --fail-on-drift --against-recorded
          else
            echo "The stamp records no commit yet (unknown): comparing against upstream HEAD."
            python3 scripts/check_template_drift.py --docs-site --fail-on-drift
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    # LDM-#2215: a PR builds and is checked, but never publishes. Without this
    # guard adding `pull_request:` above would deploy every PR over the live
    # site.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
