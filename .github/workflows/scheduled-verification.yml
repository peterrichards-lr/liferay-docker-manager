name: LDM Platform Verification (Multi-OS)

on:
  workflow_dispatch: # Allow manual trigger
  schedule:
    - cron: '0 2 * * *' # Run nightly at 2 AM UTC
  push:
    tags: ["v*"] # Run on every release

# LDM-385: Prevent simultaneous runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default: read-only. The sync-compatibility job overrides this with write access.
permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Skip check if not a tag push
        id: check_trigger
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Code
        if: steps.check_trigger.outputs.is_tag == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Tag and Branch Alignment
        if: steps.check_trigger.outputs.is_tag == 'true'
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" == *"-"* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          
          git fetch origin master
          if git branch -r --contains ${{ github.sha }} | grep -E 'origin/master$' >/dev/null; then
            ON_MASTER=true
          else
            ON_MASTER=false
          fi
          
          echo "Tag: $TAG_NAME"
          echo "Is Pre-release: $IS_PRERELEASE"
          echo "Is on master: $ON_MASTER"
          
          if [ "$IS_PRERELEASE" = "true" ] && [ "$ON_MASTER" = "true" ]; then
            echo "::error::Pre-release tags (containing '-') cannot be pushed on master branch!"
            exit 1
          elif [ "$IS_PRERELEASE" = "false" ] && [ "$ON_MASTER" = "false" ]; then
            echo "::error::Stable release tags (no '-') must only be pushed on master branch!"
            exit 1
          fi
          echo "Tag validation successful!"

  verify-linux:
    needs: validate-tag
    name: Verify Linux (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, fedora, rockylinux, alpine, debian]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run E2E Verification Suite (Ubuntu)
        if: matrix.distro == 'ubuntu'
        env:
          GITHUB_ACTIONS: "true"
          # LDM-#1614: declare which distro this run represents, so the report
          # carries its own identity instead of leaving sync_compatibility.py
          # to infer one from a platform string. Ubuntu is the host OS here and
          # was inferred correctly by accident; the four containerised arms were
          # not, and collapsed onto a single matrix row.
          LDM_ENV_LABEL: ${{ matrix.distro }}
        run: |
          sudo apt-get update || true
          sudo apt-get install -y python3-pip git docker-compose python3-venv hostname
          python3 -m venv .venv
          source .venv/bin/activate
          pip install .
          bash scripts/verify_e2e_refactor.sh --ci

      - name: Run E2E Verification Suite (Fedora)
        if: matrix.distro == 'fedora'
        run: |
          docker run --rm --privileged \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e GITHUB_ACTIONS="true" \
            -e LDM_ENV_LABEL="${{ matrix.distro }}" \
            fedora:latest \
            bash -c "dnf install -y python3-pip git docker-compose hostname which && python3 -m venv .venv && source .venv/bin/activate && pip install . && bash scripts/verify_e2e_refactor.sh --ci"

      - name: Run E2E Verification Suite (RockyLinux)
        if: matrix.distro == 'rockylinux'
        run: |
          docker run --rm --privileged \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e GITHUB_ACTIONS="true" \
            -e LDM_ENV_LABEL="${{ matrix.distro }}" \
            rockylinux:9 \
            bash -c "dnf install -y dnf-plugins-core && dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo && dnf install -y python3.11 python3.11-pip git hostname docker-ce-cli docker-compose-plugin which && python3.11 -m venv .venv && source .venv/bin/activate && pip install --upgrade pip && pip install . && bash scripts/verify_e2e_refactor.sh --ci"

      - name: Run E2E Verification Suite (Alpine)
        if: matrix.distro == 'alpine'
        run: |
          docker run --rm --privileged \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e GITHUB_ACTIONS="true" \
            -e LDM_ENV_LABEL="${{ matrix.distro }}" \
            alpine:latest \
            sh -c "apk add --no-cache python3 py3-pip git bash docker-cli docker-cli-compose gcc musl-dev libffi-dev python3-dev && python3 -m venv .venv && source .venv/bin/activate && pip install --upgrade pip && pip install . && bash scripts/verify_e2e_refactor.sh --ci"

      - name: Run E2E Verification Suite (Debian)
        if: matrix.distro == 'debian'
        run: |
          docker run --rm --privileged \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e GITHUB_ACTIONS="true" \
            -e LDM_ENV_LABEL="${{ matrix.distro }}" \
            debian:bookworm \
            bash -c "apt-get update && apt-get install -y ca-certificates curl gnupg && mkdir -p /etc/apt/keyrings && curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg && echo \"deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable\" > /etc/apt/sources.list.d/docker.list && apt-get update && apt-get install -y python3-pip python3-venv git hostname docker-ce-cli docker-compose-plugin && python3 -m venv .venv && source .venv/bin/activate && pip install --upgrade pip && pip install . && bash scripts/verify_e2e_refactor.sh --ci"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-results-${{ matrix.distro }}
          path: verify-*.txt
          retention-days: 7

      # LDM-#1611: second, independent signal. The step above is the primary
      # one -- the script's exit status -- but that status has been silently
      # lost before (see the verify-windows job), and when it is, a green job
      # manufactures coverage that does not exist. The report the script writes
      # names its own outcome in its filename, so cross-check it. Runs after
      # the upload so the artifact still reaches the run either way.
      - name: Assert the verification report says it passed
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          reports=(verify-*.txt)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::No verification report was produced by scripts/verify_e2e_refactor.sh."
            exit 1
          fi
          rc=0
          for report in "${reports[@]}"; do
            if [[ "$report" == *-fail.txt ]]; then
              echo "::error::${report} is a FAILURE report; this job did not verify anything."
              rc=1
            elif ! grep -q "ALL E2E VERIFICATIONS PASSED" "$report"; then
              echo "::error::${report} has no 'ALL E2E VERIFICATIONS PASSED' marker; the suite did not run to completion."
              rc=1
            else
              echo "OK: ${report}"
            fi
          done
          exit "$rc"

  verify-windows:
    needs: validate-tag
    # LDM-#1500: both shells, on the same runner. windows-latest carries
    # Windows PowerShell 5.1 as `powershell` and PowerShell 7 as `pwsh`.
    #
    # 5.1 stays the PRIMARY target because it is what ships with Windows and
    # what users run by default. Verifying only on 7 would stop testing the
    # configuration most Windows users actually have -- on the platform that
    # produced a real failure in each of the last two cycles (#1465, #1484,
    # #1486 all came from it).
    #
    # 7 is added, not substituted. It differs in the ways that matter here:
    # UTF-8 defaults, and no ANSI-code-page parse limits on the script itself.
    # Note it would NOT have caught #1484 -- that flattening was in LDM's own
    # stdout encoder, and once a child process has replaced the characters no
    # shell can recover them.
    name: Verify Windows Native (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      # Both arms run even if one fails: which shell broke is the finding.
      fail-fast: false
      matrix:
        include:
          - shell: powershell   # Windows PowerShell 5.1 -- the default install
          - shell: pwsh         # PowerShell 7
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install LDM
        run: |
          python -m pip install --upgrade pip
          pip install .

      # LDM-#1611: propagate the child shell's exit status explicitly.
      # The script now exits nonzero on failure (it did not before -- see the
      # comment at the bottom of scripts/verify_e2e_refactor.ps1), but that
      # only helps if this step forwards it. Relying on the runner's implicit
      # `exit $LASTEXITCODE` epilogue leaves the whole chain resting on an
      # undeclared default, which is how this job reported `success` on runs
      # that never got past infrastructure setup.
      - name: Run E2E Verification Suite (Windows, ${{ matrix.shell }})
        shell: pwsh
        env:
          GITHUB_ACTIONS: "true"
        run: |
          ${{ matrix.shell }} -File scripts/verify_e2e_refactor.ps1
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            Write-Host "::error::scripts/verify_e2e_refactor.ps1 exited $rc under ${{ matrix.shell }}."
            exit $rc
          }

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-results-windows-${{ matrix.shell }}
          path: verify-*.txt
          retention-days: 7

      # LDM-#1611: see the equivalent step in verify-linux. Written in
      # PowerShell rather than bash because that is the shell this job already
      # runs in; the check is the same one.
      - name: Assert the verification report says it passed
        if: always()
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Path . -Filter "verify-*.txt" -File -ErrorAction SilentlyContinue)
          if ($reports.Count -eq 0) {
            Write-Host "::error::No verification report was produced by scripts/verify_e2e_refactor.ps1."
            exit 1
          }
          $bad = $false
          foreach ($report in $reports) {
            if ($report.Name -like "*-fail.txt") {
              Write-Host "::error::$($report.Name) is a FAILURE report; this job did not verify anything."
              $bad = $true
            } elseif (-not (Select-String -Path $report.FullName -Pattern "ALL E2E VERIFICATIONS PASSED" -SimpleMatch -Quiet)) {
              Write-Host "::error::$($report.Name) has no 'ALL E2E VERIFICATIONS PASSED' marker; the suite did not run to completion."
              $bad = $true
            } else {
              Write-Host "OK: $($report.Name)"
            }
          }
          if ($bad) { exit 1 }

  verify-macos:
    needs: validate-tag
    name: Verify macOS (Colima)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Colima and Docker
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install colima docker docker-compose || true

      # The continue-on-error here is NOT the LDM-#1611 defect and is kept
      # deliberately: if Colima cannot start, the suite step below fails on
      # its own (and now says so), which produces a report and the failure
      # debug logs instead of aborting the job with only a brew/colima trace.
      - name: Start Colima
        continue-on-error: true
        run: |
          colima start --cpu 2 --memory 4 --vm-type=vfkit || colima start --cpu 2 --memory 4

      # LDM-#1611: `continue-on-error: true` was here, and it is the whole bug
      # on this platform. The bash script propagates its own failure correctly
      # (`set -e` plus explicit `exit 1`), so nothing else was swallowing it --
      # the step simply declared the failure unimportant. Runs 33752742268
      # (v2.21.0-pre.2) and 34063433007 (v2.21.0) reported `success` while
      # uploading a `-fail.txt` report containing a header, "Docker: running"
      # and "--- FAILURE DEBUG LOGS ---": no verification step ever ran.
      #
      # The macOS runner's Docker being unusable is a runner defect, not an
      # LDM defect, and fixing that is out of scope here. But a job that
      # cannot report failure is worse than an absent one, because it
      # manufactures the evidence the compatibility matrix is built from.
      # A red job says "unverified"; a green one said "verified" and was wrong.
      - name: Run E2E Verification Suite (macOS)
        env:
          GITHUB_ACTIONS: "true"
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install .
          bash scripts/verify_e2e_refactor.sh --ci

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-results-macos
          path: verify-*.txt
          retention-days: 7

      # LDM-#1611: see the equivalent step in verify-linux.
      - name: Assert the verification report says it passed
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          reports=(verify-*.txt)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::No verification report was produced by scripts/verify_e2e_refactor.sh."
            exit 1
          fi
          rc=0
          for report in "${reports[@]}"; do
            if [[ "$report" == *-fail.txt ]]; then
              echo "::error::${report} is a FAILURE report; this job did not verify anything."
              rc=1
            elif ! grep -q "ALL E2E VERIFICATIONS PASSED" "$report"; then
              echo "::error::${report} has no 'ALL E2E VERIFICATIONS PASSED' marker; the suite did not run to completion."
              rc=1
            else
              echo "OK: ${report}"
            fi
          done
          exit "$rc"

  sync-compatibility:
    name: Sync Compatibility Table
    needs: [verify-linux, verify-windows, verify-macos]
    runs-on: ubuntu-latest
    # Only sync on STABLE release tag pushes -- not nightly cron, manual
    # dispatch, or pre-release tags. This job checks out master (which only
    # ever holds the latest stable VERSION) to author its PR; a Linux report
    # generated from a pre-release tag bakes in a pre-release version that
    # will never match master's, so sync_compatibility.py's staleness check
    # always rejects it -- it gets silently archived and never reaches the
    # table (LDM-#1043). Mirrors the same "-" check validate-tag already
    # uses to distinguish stable vs. pre-release tags.
    #
    # LDM-#1611: gated on verify-linux ONLY, and deliberately tolerant of the
    # other two. Until #1611 the Windows and macOS jobs could not report
    # failure, so plain `needs:` semantics never blocked this job. Now that
    # they can, `needs: [...]` alone would skip the sync on every stable tag
    # for as long as the runner Docker defects persist -- silently trading one
    # broken signal for another. This job only ever consumes the ubuntu and
    # fedora artifacts (see the download steps below), so verify-linux is the
    # only dependency whose outcome it actually needs. The `!cancelled()`
    # status-check function is what lets `needs.*.result` be evaluated at all
    # after a dependency fails; without it the job is skipped before this
    # expression runs.
    if: |
      !cancelled() &&
      needs.verify-linux.result == 'success' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-')
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v7
        with:
          ref: master
          # LDM-#1070: the default GITHUB_TOKEN makes this PR's head commit
          # authored/pushed by the github-actions[bot] identity, which has
          # (at least once) tripped GitHub's workflow-run approval gate on
          # this repo despite not being a fork -- something a PAT tied to a
          # real collaborator account never triggers. Falls back to
          # GITHUB_TOKEN if the secret isn't configured, so this doesn't
          # hard-fail the whole workflow in a fork/testing context.
          token: ${{ secrets.LDM_BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r requirements.txt
          pip install --disable-pip-version-check -e .

      - name: Download Ubuntu verification report
        uses: actions/download-artifact@v8
        with:
          name: verification-results-ubuntu
          path: ci-reports/
        continue-on-error: true

      - name: Download Fedora verification report
        uses: actions/download-artifact@v8
        with:
          name: verification-results-fedora
          path: ci-reports/
        continue-on-error: true

      - name: Sync CI reports into repository
        run: |
          # Remove stale CI-managed Linux reports before replacing with fresh ones.
          # Manual reports (macOS/Windows) are intentionally never touched here.
          rm -f references/verification-results/verify-linux-workstation-ubuntu-*.txt
          rm -f references/verification-results/verify-linux-workstation-fedora-*.txt
          # Copy only passing reports from this CI run.
          # LDM-#1018: verify_e2e_refactor.sh --ci writes a plain
          # verify-{slug}-pass.txt (nothing after "pass" but the extension) --
          # the previous "-pass-*.txt" pattern required a suffix after "pass"
          # and only ever matched archived/hash-suffixed filenames, silently
          # matching zero real reports and leaving the rm -f above with
          # nothing to replace what it just deleted.
          find ci-reports/ -name "verify-*-pass*.txt" -exec cp {} references/verification-results/ \; 2>/dev/null || true
          echo "Reports now in references/verification-results/:"
          ls -1 references/verification-results/verify-*.txt 2>/dev/null || echo "  (none found)"

      - name: Regenerate compatibility table
        run: python3 scripts/sync_compatibility.py

      - name: Stage changes
        id: changes
        run: |
          git add references/verification-results/ docs/reference/compatibility.md docs/TESTING.md
          # Stage README.md only if it exists (it may not be present on all branches)
          if [ -f README.md ]; then
            git add README.md
          fi
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected — compatibility table is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected — will open a pull request."
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          # LDM-#1070: same PAT as the checkout step, for the same reason --
          # gh pr create/edit/merge below need to authenticate as a real
          # collaborator account too, not just the git push itself.
          GH_TOKEN: ${{ secrets.LDM_BOT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          LDM_VERSION=$(python3 scripts/get_version.py)
          BRANCH="docs/compat-sync-ci-${LDM_VERSION}-$(date +%Y%m%d-%H%M%S)"
          PR_BODY="Automatically generated by the **LDM Platform Verification (Multi-OS)** workflow after release \`v${LDM_VERSION}\`."
          # LDM-#1070: attributed to a real account (matching the PAT used
          # to push/create the PR above) rather than github-actions[bot] --
          # closes the gap for good rather than just working around it.
          git config user.name "Peter Richards"
          git config user.email "peter.richards@liferay.com"
          git checkout -b "$BRANCH"
          git commit -m "docs: sync compatibility table from CI verification (v${LDM_VERSION})"
          git push origin "$BRANCH"
          gh pr create \
            --title "docs: Sync Compatibility Table from CI (v${LDM_VERSION})" \
            --body "$PR_BODY" \
            --base master \
            --head "$BRANCH"
          # This PR isn't tied to a tracked issue (mirrors the same label
          # scripts/release.py applies to its own release-bump PRs, #1005) --
          # without it, the mandatory issue-link-check fails on every single
          # run of this workflow.
          gh pr edit "$BRANCH" --add-label no-issue-needed || true
          # LDM-#1041: this PR is a deterministic, docs-only regeneration
          # from CI's own verification data -- once the same required
          # checks every other PR must pass are green, there's nothing left
          # for a human to gate on. Auto-merge removes the manual click
          # without skipping any of those checks.
          gh pr merge "$BRANCH" --auto --squash || true
