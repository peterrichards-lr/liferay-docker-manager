name: LDM Platform Verification (Multi-OS)

on:
  workflow_dispatch: # Allow manual trigger
  schedule:
    - cron: '0 2 * * *' # Run nightly at 2 AM UTC
  push:
    tags: ["v*"] # Run on every release

# LDM-385: Prevent simultaneous runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default: read-only. The sync-compatibility job overrides this with write access.
permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Skip check if not a tag push
        id: check_trigger
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Code
        if: steps.check_trigger.outputs.is_tag == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Tag and Branch Alignment
        if: steps.check_trigger.outputs.is_tag == 'true'
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" == *"-"* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          
          git fetch origin master
          if git branch -r --contains ${{ github.sha }} | grep -E 'origin/master$' >/dev/null; then
            ON_MASTER=true
          else
            ON_MASTER=false
          fi
          
          echo "Tag: $TAG_NAME"
          echo "Is Pre-release: $IS_PRERELEASE"
          echo "Is on master: $ON_MASTER"
          
          if [ "$IS_PRERELEASE" = "true" ] && [ "$ON_MASTER" = "true" ]; then
            echo "::error::Pre-release tags (containing '-') cannot be pushed on master branch!"
            exit 1
          elif [ "$IS_PRERELEASE" = "false" ] && [ "$ON_MASTER" = "false" ]; then
            echo "::error::Stable release tags (no '-') must only be pushed on master branch!"
            exit 1
          fi
          echo "Tag validation successful!"

  verify-linux:
    needs: validate-tag
    name: Verify Linux (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, fedora, rockylinux, alpine, debian]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # LDM-#1659: every arm of this workflow was red from 2026-09-07 because
      # nothing here installed a JDK -- it depended on whatever the runner
      # image made the default `java`, and that is 17. `ImportPipeline` gates
      # on `_check_java_version("21")` before reading a manifest, so the .ldmp
      # refusal assertion got exit 1 for the wrong reason and correctly failed.
      # A JRE would do (the suite never runs gradle or javac) but setup-java
      # gives a JDK and costs nothing extra.
      - name: Set up JDK 21
        if: matrix.distro == 'ubuntu'
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Run E2E Verification Suite (Ubuntu)
        if: matrix.distro == 'ubuntu'
        env:
          GITHUB_ACTIONS: "true"
          # LDM-#1614: declare which distro this run represents, so the report
          # carries its own identity instead of leaving sync_compatibility.py
          # to infer one from a platform string. Ubuntu is the host OS here and
          # was inferred correctly by accident; the four containerised arms were
          # not, and collapsed onto a single matrix row.
          LDM_ENV_LABEL: ${{ matrix.distro }}
        run: |
          sudo apt-get update || true
          sudo apt-get install -y python3-pip git docker-compose python3-venv hostname
          python3 -m venv .venv
          source .venv/bin/activate
          pip install .
          bash scripts/verify_e2e_refactor.sh --ci

      - name: Run E2E Verification Suite (Fedora)
        if: matrix.distro == 'fedora'
        run: |
          docker run --rm --privileged \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e GITHUB_ACTIONS="true" \
            -e LDM_ENV_LABEL="${{ matrix.distro }}" \
            fedora:latest \
            bash -c "dnf install -y python3-pip git docker-compose hostname which && (dnf install -y java-21-openjdk-headless || dnf install -y java-25-openjdk-headless) && python3 -m venv .venv && source .venv/bin/activate && pip install . && bash scripts/verify_e2e_refactor.sh --ci"

      - name: Run E2E Verification Suite (RockyLinux)
        if: matrix.distro == 'rockylinux'
        run: |
          docker run --rm --privileged \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e GITHUB_ACTIONS="true" \
            -e LDM_ENV_LABEL="${{ matrix.distro }}" \
            rockylinux:9 \
            bash -c "dnf install -y dnf-plugins-core && dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo && dnf install -y python3.11 python3.11-pip git hostname docker-ce-cli docker-compose-plugin which java-21-openjdk-headless && python3.11 -m venv .venv && source .venv/bin/activate && pip install --upgrade pip && pip install . && bash scripts/verify_e2e_refactor.sh --ci"

      - name: Run E2E Verification Suite (Alpine)
        if: matrix.distro == 'alpine'
        run: |
          docker run --rm --privileged \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e GITHUB_ACTIONS="true" \
            -e LDM_ENV_LABEL="${{ matrix.distro }}" \
            alpine:latest \
            sh -c "apk add --no-cache python3 py3-pip git bash docker-cli docker-cli-compose gcc musl-dev libffi-dev python3-dev openjdk21-jre-headless && python3 -m venv .venv && source .venv/bin/activate && pip install --upgrade pip && pip install . && bash scripts/verify_e2e_refactor.sh --ci"

      - name: Run E2E Verification Suite (Debian)
        if: matrix.distro == 'debian'
        run: |
          docker run --rm --privileged \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e GITHUB_ACTIONS="true" \
            -e LDM_ENV_LABEL="${{ matrix.distro }}" \
            debian:bookworm \
            bash -c "apt-get update && apt-get install -y ca-certificates curl gnupg && mkdir -p /etc/apt/keyrings && curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg && echo \"deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable\" > /etc/apt/sources.list.d/docker.list && curl -fsSL https://packages.adoptium.net/artifactory/api/gpg/key/public | gpg --dearmor -o /etc/apt/keyrings/adoptium.gpg && echo \"deb [signed-by=/etc/apt/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb bookworm main\" > /etc/apt/sources.list.d/adoptium.list && apt-get update && apt-get install -y python3-pip python3-venv git hostname docker-ce-cli docker-compose-plugin temurin-21-jre && python3 -m venv .venv && source .venv/bin/activate && pip install --upgrade pip && pip install . && bash scripts/verify_e2e_refactor.sh --ci"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-results-${{ matrix.distro }}
          path: verify-*.txt
          retention-days: 7

      # LDM-#1611: second, independent signal. The step above is the primary
      # one -- the script's exit status -- but that status has been silently
      # lost before (see the verify-windows job), and when it is, a green job
      # manufactures coverage that does not exist. The report the script writes
      # names its own outcome in its filename, so cross-check it. Runs after
      # the upload so the artifact still reaches the run either way.
      - name: Assert the verification report says it passed
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          reports=(verify-*.txt)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::No verification report was produced by scripts/verify_e2e_refactor.sh."
            exit 1
          fi
          rc=0
          for report in "${reports[@]}"; do
            if [[ "$report" == *-fail.txt ]]; then
              echo "::error::${report} is a FAILURE report; this job did not verify anything."
              rc=1
            elif ! grep -q "ALL E2E VERIFICATIONS PASSED" "$report"; then
              echo "::error::${report} has no 'ALL E2E VERIFICATIONS PASSED' marker; the suite did not run to completion."
              rc=1
            else
              echo "OK: ${report}"
            fi
          done
          exit "$rc"

  sync-compatibility:
    name: Sync Compatibility Table
    needs: [verify-linux]
    runs-on: ubuntu-latest
    # Only sync on STABLE release tag pushes -- not nightly cron, manual
    # dispatch, or pre-release tags. This job checks out master (which only
    # ever holds the latest stable VERSION) to author its PR; a Linux report
    # generated from a pre-release tag bakes in a pre-release version that
    # will never match master's, so sync_compatibility.py's staleness check
    # always rejects it -- it gets silently archived and never reaches the
    # table (LDM-#1043). Mirrors the same "-" check validate-tag already
    # uses to distinguish stable vs. pre-release tags.
    #
    # LDM-#1611 / LDM-#1662: verify-linux is the only dependency, because it is
    # the only arm this job publishes (see the download and copy steps below,
    # which filter on the `linux-workstation-` prefix).
    #
    # It used to depend on all three arms and compensate with an explicit
    # `needs.verify-linux.result` test, because the Windows and macOS jobs could
    # not report failure before #1611 and, once they could, plain `needs:`
    # semantics would have skipped the sync on every stable tag for as long as
    # the runner Docker defects persisted -- silently trading one broken signal
    # for another. LDM-#1662 moved those arms to
    # `best-effort-verification.yml`, so the dependency list now says what it
    # means and the compensation is no longer load-bearing.
    #
    # The explicit result test and `!cancelled()` are kept regardless: they are
    # what stop a *skipped* verify-linux (which is not a failure) from being
    # read as success.
    if: |
      !cancelled() &&
      needs.verify-linux.result == 'success' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-')
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v7
        with:
          ref: master
          # LDM-#1070: the default GITHUB_TOKEN makes this PR's head commit
          # authored/pushed by the github-actions[bot] identity, which has
          # (at least once) tripped GitHub's workflow-run approval gate on
          # this repo despite not being a fork -- something a PAT tied to a
          # real collaborator account never triggers. Falls back to
          # GITHUB_TOKEN if the secret isn't configured, so this doesn't
          # hard-fail the whole workflow in a fork/testing context.
          token: ${{ secrets.LDM_BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r requirements.txt
          pip install --disable-pip-version-check -e .

      # LDM-#1625: one pattern, not one hardcoded step per distro. This was two
      # steps -- ubuntu and fedora -- while verify-linux ran five arms, so
      # Debian, Rocky and Alpine ran on every stable tag, passed, uploaded an
      # artifact, and had it discarded by the job whose purpose is to publish
      # it. The matrix understated real coverage by three environments and
      # nothing failed, because a list that has drifted out of step with
      # another list looks exactly like a list that has not. A glob cannot
      # drift: a sixth arm added to `matrix.distro` needs no change here.
      #
      # This deliberately also fetches the macOS and Windows artifacts, which
      # this job must NOT publish -- those rows are curated by hand. The copy
      # step below filters on the `linux-workstation-` prefix every
      # verify-linux report carries instead, so that invariant is enforced
      # where the files are actually used rather than by what was downloaded.
      - name: Download verification reports
        uses: actions/download-artifact@v8
        with:
          pattern: verification-results-*
          path: ci-reports/
          merge-multiple: true
        continue-on-error: true

      - name: Sync CI reports into repository
        shell: bash
        run: |
          # Passing reports from this CI run, Linux only.
          #
          # LDM-#1018: verify_e2e_refactor.sh --ci writes a plain
          # verify-{slug}-pass.txt (nothing after "pass" but the extension) --
          # the previous "-pass-*.txt" pattern required a suffix after "pass"
          # and only ever matched archived/hash-suffixed filenames, silently
          # matching zero real reports and leaving the rm -f below with
          # nothing to replace what it just deleted.
          #
          # LDM-#1625: keyed on `linux-workstation-`, the prefix every
          # verify-linux report carries and no macOS/Windows one does (theirs
          # begin verify-apple-silicon- / verify-windows-pc-). Manual reports
          # for those platforms therefore stay untouched even though the step
          # above downloads their artifacts.
          #
          # Collected with a read loop rather than `mapfile` so the step body
          # runs unchanged on bash 3.2, which is what macOS ships -- this is
          # the only way to exercise it outside a real workflow run.
          fresh=()
          while IFS= read -r report; do
            fresh+=("$report")
          done < <(find ci-reports/ -name 'verify-linux-workstation-*-pass*.txt' -print | sort)
          if [ ${#fresh[@]} -eq 0 ]; then
            echo "::error::No passing Linux verification report was downloaded, so there is nothing to publish. Refusing to clear the committed Linux reports (LDM-#1625)."
            exit 1
          fi
          echo "Publishing ${#fresh[@]} Linux verification report(s):"
          printf '  %s\n' "${fresh[@]}"
          # Remove the CI-managed Linux reports this run supersedes, so a
          # distro whose version moved (fedora-43 -> fedora-44) leaves one row
          # rather than two. Every arm has passed by the time this job runs --
          # it is gated on verify-linux succeeding as a whole -- so each
          # deleted report is replaced by the copy below.
          rm -f references/verification-results/verify-linux-workstation-*.txt
          cp "${fresh[@]}" references/verification-results/
          echo "Reports now in references/verification-results/:"
          ls -1 references/verification-results/verify-*.txt 2>/dev/null || echo "  (none found)"

      - name: Regenerate compatibility table
        run: python3 scripts/sync_compatibility.py

      - name: Stage changes
        id: changes
        run: |
          git add references/verification-results/ docs/reference/compatibility.md docs/TESTING.md
          # Stage README.md only if it exists (it may not be present on all branches)
          if [ -f README.md ]; then
            git add README.md
          fi
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected — compatibility table is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected — will open a pull request."
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          # LDM-#1070: same PAT as the checkout step, for the same reason --
          # gh pr create/edit/merge below need to authenticate as a real
          # collaborator account too, not just the git push itself.
          GH_TOKEN: ${{ secrets.LDM_BOT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          LDM_VERSION=$(python3 scripts/get_version.py)
          BRANCH="docs/compat-sync-ci-${LDM_VERSION}-$(date +%Y%m%d-%H%M%S)"
          PR_BODY="Automatically generated by the **LDM Platform Verification (Multi-OS)** workflow after release \`v${LDM_VERSION}\`."
          # LDM-#1070: attributed to a real account (matching the PAT used
          # to push/create the PR above) rather than github-actions[bot] --
          # closes the gap for good rather than just working around it.
          git config user.name "Peter Richards"
          git config user.email "peter.richards@liferay.com"
          git checkout -b "$BRANCH"
          git commit -m "docs: sync compatibility table from CI verification (v${LDM_VERSION})"
          git push origin "$BRANCH"
          gh pr create \
            --title "docs: Sync Compatibility Table from CI (v${LDM_VERSION})" \
            --body "$PR_BODY" \
            --base master \
            --head "$BRANCH"
          # This PR isn't tied to a tracked issue (mirrors the same label
          # scripts/release.py applies to its own release-bump PRs, #1005) --
          # without it, the mandatory issue-link-check fails on every single
          # run of this workflow.
          gh pr edit "$BRANCH" --add-label no-issue-needed || true
          # LDM-#1041: this PR is a deterministic, docs-only regeneration
          # from CI's own verification data -- once the same required
          # checks every other PR must pass are green, there's nothing left
          # for a human to gate on. Auto-merge removes the manual click
          # without skipping any of those checks.
          gh pr merge "$BRANCH" --auto --squash || true
