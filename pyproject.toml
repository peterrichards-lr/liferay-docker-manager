[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liferay-docker-manager"
# LDM_MAGIC_VERSION: 2.20.0-pre.5
version = "2.20.0-pre.5"





description = "A professional command-line orchestrator for Liferay Docker environments."
authors = [{ name = "Peter Richards", email = "peter.richards@liferay.com" }]
license = { text = "MIT" }
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
    "watchdog==6.0.0",
    "pyobjc-framework-FSEvents; sys_platform == 'darwin'",
    "requests==2.34.2",
    "PyYAML==6.0.3",
    "argcomplete==3.7.2",
    "flask==3.1.3",
    "mcp==2.1.1",
    "packaging>=23.1",
    "keyring==25.7.0",
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
]

[project.scripts]
ldm = "ldm_core.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
ldm_core = ["resources/*", "resources/**/*", "resources/common_baseline/*", "resources/dashboard/*", "resources/infra-compose.yml", "resources/ldm.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ldm_core*"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "PL",   # pylint
    "RUF",  # Ruff-specific rules
    "C90",  # mccabe
]
ignore = [
    "E501",    # Line too long (fix gradually)
    "PLC0415", # localized imports (intentional for performance/dependency isolation)
    "PLR0917", # Too many positional arguments
    "PLR2004", # Magic value in comparison
    "B904",    # Within an except clause, raise exceptions with raise ... from err
    "N806",    # Variable name should be lowercase
    "PTH123",  # open() should be replaced by Path.open()
    "RUF001",  # Ambiguous unicode character
    "ARG001",  # Unused function argument
    "ARG002",  # Unused method argument
    "ARG004",  # Unused static method argument
    "PTH110",  # os.path.exists()
    "PTH105",  # os.replace()
    "PTH101",  # os.chmod()
    "PTH112",  # os.path.isdir()
    "PTH118",  # os.path.join()
    "PTH107",  # os.remove()
    "PTH104",  # os.rename()
    "PTH108",  # os.unlink()
    "PTH109",  # os.getcwd()
    "PTH120",  # os.path.dirname()
    "SIM105",  # Use contextlib.suppress
    "SIM117",  # Use single with statement
    "SIM102",  # Use single if statement
    "PLW2901", # for loop variable overwritten
    "PLE2513", # Invalid unescaped character ESC
    "SIM108",  # Use ternary operator
    "PTH208",  # Path.iterdir()
    "PTH121",  # Path.samefile()
    "B018",    # Useless expression
    "PLC0206", # Extracting value without items()
    "RUF059",  # Unused unpacked variable
]

[tool.ruff.lint.isort]
known-first-party = ["ldm_core"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-returns = 6
max-statements = 60

[tool.pytest.ini_options]
testpaths = ["ldm_core/tests"]
python_files = "test_*.py"
# Deliberately no --cov-fail-under here: a command-line value overrides
# [tool.coverage.report] fail_under, which previously left two conflicting
# floors declared (40 here, 60 below) with only the looser one enforced.
# The floor is defined in exactly one place -- see fail_under below. (#1239)
addopts = "--cov=ldm_core --cov-report=term-missing"
markers = [
    # LDM-#1409: opts a test out of the block_real_docker guard in
    # ldm_core/tests/conftest.py. Use it only for tests that genuinely need a
    # live daemon, and expect them to create and remove real resources on the
    # machine that runs them. Skip them with: pytest -m "not needs_docker"
    "needs_docker: test requires a real Docker daemon and may touch real containers",
    # For tests whose subject IS a Docker helper that conftest stubs. They mock
    # `run_command` themselves, so they never reach a daemon -- they just need
    # the real function back to assert on the argv it builds.
    "exercises_docker_helper: test asserts on a helper that stub_docker_environment_probes replaces",
]

[tool.coverage.run]
source = ["ldm_core"]
omit = ["ldm_core/tests/*"]

[tool.coverage.report]
# THE single source of truth for the minimum coverage gate. Change it here and
# nowhere else; do not reintroduce --cov-fail-under in addopts above.
#
# Ratcheted 60 -> 70 in LDM-#1515, when the suite measured 71%. The gate is an
# anti-erosion device, not a bug-finder: every bug shipped in the v2.19.0 cycle
# was in code that already had line coverage (#1512 in a module at 83%). It
# exists so that eleven points of headroom cannot be quietly spent when several
# branches land together. The lever that finds bugs is behaviour coverage
# (#1513/#1516) -- do not raise this number expecting it to do that job.
fail_under = 70

[tool.deptry]
extend_exclude = [
    "ldm_core/tests",
    "scripts"
]

[tool.deptry.per_rule_ignores]
DEP002 = ["pyobjc-framework-FSEvents"]
